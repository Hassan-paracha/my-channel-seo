name: Global SEO Rolling Cycle

on:
  schedule:
    - cron: '0 19 * * *'   # Midnight PKT (UTC+5)
  workflow_dispatch:

concurrency:
  group: seo-cycle
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pages: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Run rolling engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SITE_BASE_URL: https://hassan-paracha.github.io/my-channel-seo/
        run: python engine.py

      - name: Commit and push database state
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git config user.name "SEO-Cycle-Bot"
          git config user.email "bot@seo.com"
          git add video_db.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily video DB refresh: $(date -u +%F)"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
