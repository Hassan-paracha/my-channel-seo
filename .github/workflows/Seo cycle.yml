name: Global SEO Rolling Cycle

on:
  schedule:
    - cron: "0 19 * * *"   # 19:00 UTC daily (00:00 PKT)
  workflow_dispatch:
    inputs:
      sync_slice_size:
        description: "Videos to refresh with yt-dlp this run"
        default: "50"
      refresh_per_day:
        description: "SEO records to regenerate this run"
        default: "180"
      dry_run:
        description: "Build the site only (no YouTube, Gemini or DB writes)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SYNC_SLICE_SIZE: ${{ inputs.sync_slice_size || '50' }}
      REFRESH_PER_DAY: ${{ inputs.refresh_per_day || '180' }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      SITE_BASE_URL: "https://hassan-paracha.github.io/my-channel-seo/"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Run rolling engine
        env:
          MIN_REFRESH_DAYS: "0"   # always refresh the oldest-optimized videos first
        run: python engine.py

      - name: Commit and push database state
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "SEO-Cycle-Bot"
          git config user.email "bot@seo.com"
          git add video_db.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily video DB refresh: $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
